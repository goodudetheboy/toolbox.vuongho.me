  </g>
  <ellipse cx="261" cy="179" rx="98" ry="32" fill="none" stroke="#a87d26" stroke-width="7" opacity="0.75"/>
  <ellipse cx="221" cy="165" rx="38" ry="9" fill="#fff" opacity="0.45"/>
