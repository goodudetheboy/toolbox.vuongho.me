      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#e2b54a"/>
      <stop offset="1" stop-color="#b8892c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6420"/>
      <stop offset="0.35" stop-color="#c79a3a"/>
      <stop offset="1" stop-color="#7a561a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#17795a"/>
  <g>
    <path d="M132 299 V335 A124 42 0 0 0 380 335 V299 Z" fill="url(#edge)"/>
