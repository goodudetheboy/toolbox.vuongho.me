name: Deploy

on:
  push:
    branches: [main]
  # Weekly (Mondays ~7am US Eastern), so churn-machine's deals (refreshed from
  # Doctor of Credit at build time) stay current between pushes. See ADR 0007.
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

# Write: the churn-machine refresh commits Gemini's reads of changed deal terms.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the study-assistant API step can tell whether its code changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # study-assistant has a Cloud Run backend (holds the Gemini key); its one-time
      # Google Cloud setup is in apps/study-assistant/docs/SETUP.md.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy study-assistant API (only when it changed, or doesn't exist yet)
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SERVICE=toolbox-study-assistant-api
          REGION=us-central1
          deploy=true
          if gcloud run services describe "$SERVICE" --region "$REGION" --project vuonghome >/dev/null 2>&1; then
            # Scheduled/manual runs have no "before" commit; nothing in the API changed.
            if [ "$EVENT" != push ]; then
              deploy=false
            elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/study-assistant/api .github/workflows/deploy.yml; then
              deploy=false
            fi
          fi
          if [ "$deploy" = true ]; then
            # Keep ALLOWED_EMAILS in sync with apps/study-assistant/firestore.rules.
            gcloud run deploy "$SERVICE" \
              --source apps/study-assistant/api \
              --region "$REGION" --project vuonghome \
              --allow-unauthenticated \
              --timeout 300 --memory 512Mi --max-instances 3 \
              --set-secrets GEMINI_API_KEY=study-assistant-gemini-key:latest \
              --set-env-vars "^;^ALLOWED_EMAILS=hochivuong2002@gmail.com,tling241004@gmail.com;ALLOWED_ORIGINS=https://toolbox.vuongho.me,http://localhost:5173" \
              --quiet
          fi
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project vuonghome --format='value(status.url)')
          echo "VITE_STUDY_API_URL=$URL" >> "$GITHUB_ENV"

      # Pulls the latest deals via Doctor of Credit's WordPress API (~8 requests).
      # Never fails the deploy: on error the committed deals.json is kept.
      # On the weekly (and manual) runs only, deals whose terms are new or changed
      # are read by Gemini through Vertex AI (this service account has
      # roles/aiplatform.user); pushes skip it. See churn-machine ADR 0013.
      - name: Refresh churn-machine deals
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            CHURN_AI_TERMS=0 npm run refresh -w apps/churn-machine
          else
            GEMINI_TOKEN=$(gcloud auth print-access-token) npm run refresh -w apps/churn-machine
          fi

      # Keeps Gemini's reads so the next run doesn't read the same deals again.
      # Pushes made with GITHUB_TOKEN don't start another deploy.
      - name: Save churn-machine deal terms read by Gemini
        run: |
          FILE=apps/churn-machine/data/deal-terms.json
          if git diff --quiet -- "$FILE"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Churn machine: Gemini read changed deal terms"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Couldn't push $FILE; the next deploy will read those deals again"

      - run: npm run build
      - run: npm run combine

      # Rules before hosting: new app code may need paths the old rules don't allow yet.
      - name: Deploy Firestore security rules
        run: npx firebase-tools deploy --only firestore:rules --project vuonghome

      - run: npx firebase-tools deploy --only hosting --project vuonghome
