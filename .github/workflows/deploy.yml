name: Deploy

on:
  push:
    branches: [main]
  # Daily, so churn-machine's deals (refreshed from Doctor of Credit at build time)
  # stay current between pushes. ~7am US Eastern.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the study-assistant API step can tell whether its code changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # study-assistant has a Cloud Run backend (holds the Gemini key); its one-time
      # Google Cloud setup is in apps/study-assistant/docs/SETUP.md.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy study-assistant API (only when it changed, or doesn't exist yet)
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SERVICE=toolbox-study-assistant-api
          REGION=us-central1
          deploy=true
          if gcloud run services describe "$SERVICE" --region "$REGION" --project vuonghome >/dev/null 2>&1; then
            # Scheduled/manual runs have no "before" commit; nothing in the API changed.
            if [ "$EVENT" != push ]; then
              deploy=false
            elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/study-assistant/api .github/workflows/deploy.yml; then
              deploy=false
            fi
          fi
          if [ "$deploy" = true ]; then
            # Keep ALLOWED_EMAILS in sync with apps/study-assistant/firestore.rules.
            gcloud run deploy "$SERVICE" \
              --source apps/study-assistant/api \
              --region "$REGION" --project vuonghome \
              --allow-unauthenticated \
              --timeout 300 --memory 512Mi --max-instances 3 \
              --set-secrets GEMINI_API_KEY=study-assistant-gemini-key:latest \
              --set-env-vars "^;^ALLOWED_EMAILS=hochivuong2002@gmail.com,tling241004@gmail.com;ALLOWED_ORIGINS=https://toolbox.vuongho.me,http://localhost:5173" \
              --quiet
          fi
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project vuonghome --format='value(status.url)')
          echo "VITE_STUDY_API_URL=$URL" >> "$GITHUB_ENV"

      # Pulls the latest deals via Doctor of Credit's WordPress API (~8 requests).
      # Never fails the deploy: on error the committed deals.json is kept.
      - name: Refresh churn-machine deals
        run: npm run refresh -w apps/churn-machine

      - run: npm run build
      - run: npm run combine

      # Rules before hosting: new app code may need paths the old rules don't allow yet.
      - name: Deploy Firestore security rules
        run: npx firebase-tools deploy --only firestore:rules --project vuonghome

      - run: npx firebase-tools deploy --only hosting --project vuonghome
